name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Generate unit test coverage
        run: go test ./internal/... -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage-unit.out

      - name: Test Prometheus alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "${{ github.workspace }}/deployments/observability/rules:/etc/prometheus/rules:ro" prom/prometheus:v3.13.0 test rules /etc/prometheus/rules/gophprofile-alerts.test.yml

      - name: Check unit test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage-unit.yml
