server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  max_upload_size: 10485760
  rate_limit_per_second: 10
  rate_limit_burst: 20

database:
  dsn: "postgres://gophprofile:gophprofile@localhost:5432/gophprofile?sslmode=disable"
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

s3:
  endpoint: "localhost:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  bucket: "avatars"
  use_ssl: false
  region: "us-east-1"

broker:
  type: "rabbitmq"
  rabbitmq:
    url: "amqp://gophprofile:gophprofile-dev@localhost:5672/"
    exchange: "avatars"
    retry_delay: 30s
    max_attempts: 5
    queue_type: "classic"
  kafka:
    brokers:
      - "localhost:9092"
    group_id: "gophprofile-workers"
    max_attempts: 5
    dlq_suffix: ".dlq"
    session_timeout: 10s
    heartbeat_interval: 3s
    fetch_min_bytes: 1
    fetch_max_wait: 250ms

worker:
  concurrency: 4
  retention_period: 720h
  cleanup_interval: 24h
  reconcile_interval: 168h
  orphan_grace_period: 24h
  cleanup_batch_size: 100

log:
  backend: "slog"
  level: "debug"
  format: "console"
