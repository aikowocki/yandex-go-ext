services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: gophprofile
      POSTGRES_DB: gophprofile
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gophprofile}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gophprofile-dev}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic avatar.uploaded --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic avatar.deleted --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic avatar.uploaded.dlq --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic avatar.deleted.dlq --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000 &&
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics --entity-name avatar.uploaded --add-config cleanup.policy=delete,retention.ms=604800000 &&
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics --entity-name avatar.deleted --add-config cleanup.policy=delete,retention.ms=604800000 &&
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics --entity-name avatar.uploaded.dlq --add-config cleanup.policy=delete,retention.ms=2592000000 &&
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics --entity-name avatar.deleted.dlq --add-config cleanup.policy=delete,retention.ms=2592000000
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v2/messages"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
      - --group.filter=^gophprofile-workers$
      - --topic.filter=^avatar\\.(uploaded|deleted)(\\.dlq)?$
    ports:
      - "9308:9308"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9308/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "/cmd/jaeger/jaeger-linux", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-verify-config=true", "-config.file=/etc/loki/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "config", "/etc/prometheus/prometheus.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    depends_on:
      mailhog:
        condition: service_healthy
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      # rabbitmq:
      #   condition: service_healthy
      # kafka:
      #   condition: service_healthy
    environment:
      ENV: dev
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      BROKER_TYPE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: gophprofile-workers
      KAFKA_MAX_ATTEMPTS: 5
      KAFKA_DLQ_SUFFIX: .dlq
      KAFKA_SESSION_TIMEOUT: 10s
      KAFKA_HEARTBEAT_INTERVAL: 3s
      KAFKA_FETCH_MIN_BYTES: 1
      KAFKA_FETCH_MAX_WAIT: 250ms
#      RABBITMQ_URL: amqp://gophprofile:gophprofile-dev@rabbitmq:5672/
#      RABBITMQ_EXCHANGE: avatars
#      RABBITMQ_RETRY_DELAY: 30s
#      RABBITMQ_MAX_ATTEMPTS: 5
#      RABBITMQ_QUEUE_TYPE: classic
      LOG_FORMAT: json
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_SERVICE_VERSION: dev
      OTEL_ENVIRONMENT: development
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      # rabbitmq:
      #   condition: service_healthy
      # kafka:
      #   condition: service_healthy
    environment:
      ENV: dev
      DATABASE_URL: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      BROKER_TYPE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: gophprofile-workers
      KAFKA_MAX_ATTEMPTS: 5
      KAFKA_DLQ_SUFFIX: .dlq
      KAFKA_SESSION_TIMEOUT: 10s
      KAFKA_HEARTBEAT_INTERVAL: 3s
      KAFKA_FETCH_MIN_BYTES: 1
      KAFKA_FETCH_MAX_WAIT: 250ms
      #      RABBITMQ_URL: amqp://gophprofile:gophprofile-dev@rabbitmq:5672/
      #      RABBITMQ_EXCHANGE: avatars
      #      RABBITMQ_RETRY_DELAY: 30s
      #      RABBITMQ_MAX_ATTEMPTS: 5
      #      RABBITMQ_QUEUE_TYPE: classic
      WORKER_CONCURRENCY: 4
      LOG_FORMAT: json
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_SERVICE_VERSION: dev
      OTEL_ENVIRONMENT: development

  cronjob:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.cronjob
    profiles:
      - cronjob
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ENV: dev
      DATABASE_URL: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      LOG_FORMAT: json
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_SERVICE_VERSION: dev
      OTEL_ENVIRONMENT: development

  cronjob-scheduler:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.cronjob
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/app/cronjob-scheduler.sh"]
    environment:
      ENV: dev
      DATABASE_URL: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      LOG_FORMAT: json
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_SERVICE_VERSION: dev
      OTEL_ENVIRONMENT: development

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  kafka-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

