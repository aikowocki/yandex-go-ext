{{- range .Values.routes }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: admin-access
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-admin-basic-auth@kubernetescrd" $.Release.Namespace | quote }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
---
{{- end }}
