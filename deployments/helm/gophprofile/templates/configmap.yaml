apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.fullname" . }}-config
  labels: {{- include "gophprofile.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.config.env | quote }}
  SERVER_HOST: {{ .Values.config.serverHost | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  SERVER_READ_TIMEOUT: {{ .Values.config.serverReadTimeout | quote }}
  SERVER_WRITE_TIMEOUT: {{ .Values.config.serverWriteTimeout | quote }}
  SERVER_MAX_UPLOAD_SIZE: {{ .Values.config.serverMaxUploadSize | quote }}
  SERVER_RATE_LIMIT_PER_SECOND: {{ .Values.config.serverRateLimitPerSecond | quote }}
  SERVER_RATE_LIMIT_BURST: {{ .Values.config.serverRateLimitBurst | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_USE_SSL: {{ .Values.config.s3UseSSL | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  BROKER_TYPE: {{ .Values.config.brokerType | quote }}
  KAFKA_GROUP_ID: {{ .Values.config.kafkaGroupID | quote }}
  WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  WORKER_RETENTION_PERIOD: {{ .Values.config.workerRetentionPeriod | quote }}
  WORKER_CLEANUP_INTERVAL: {{ .Values.config.workerCleanupInterval | quote }}
  WORKER_RECONCILE_INTERVAL: {{ .Values.config.workerReconcileInterval | quote }}
  WORKER_ORPHAN_GRACE_PERIOD: {{ .Values.config.workerOrphanGracePeriod | quote }}
  WORKER_CLEANUP_BATCH_SIZE: {{ .Values.config.workerCleanupBatchSize | quote }}
  LOG_BACKEND: {{ .Values.config.logBackend | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.config.otelInsecure | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.otelTraceSampleRatio | quote }}
  OTEL_SERVICE_VERSION: {{ .Values.config.otelServiceVersion | quote }}
  OTEL_ENVIRONMENT: {{ .Values.config.otelEnvironment | quote }}
  PYROSCOPE_ENABLED: {{ .Values.config.pyroscopeEnabled | quote }}
