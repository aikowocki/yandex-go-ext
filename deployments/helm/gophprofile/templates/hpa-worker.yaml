{{- if .Values.hpa.worker.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gophprofile.fullname" . }}-worker
  labels: {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "gophprofile.fullname" . }}-worker}
  minReplicas: {{ .Values.hpa.worker.minReplicas }}
  maxReplicas: {{ .Values.hpa.worker.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.hpa.worker.cpuUtilization }}}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: {{ .Values.hpa.worker.memoryUtilization }}}}
{{- end }}
