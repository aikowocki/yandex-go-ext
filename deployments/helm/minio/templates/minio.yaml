apiVersion: v1
kind: Secret
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
type: Opaque
stringData:
  root-user: {{ .Values.rootUser | quote }}
  root-password: {{ .Values.rootPassword | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
{{- if .Values.console.enabled }}
    - name: console
      port: {{ .Values.console.port }}
      targetPort: console
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "/data", "--address", ":9000"{{- if .Values.console.enabled }}, "--console-address", ":{{ .Values.console.port }}"{{- end }}]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio, key: root-user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio, key: root-password}
          ports:
            - name: api
              containerPort: 9000
{{- if .Values.console.enabled }}
            - name: console
              containerPort: {{ .Values.console.port }}
{{- end }}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-{{ .Release.Revision }}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: "{{ .Values.mcImage.repository }}:{{ .Values.mcImage.tag }}"
          imagePullPolicy: {{ .Values.mcImage.pullPolicy }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio, key: root-user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio, key: root-password}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
              mc mb --ignore-existing "local/{{ .Values.bucket }}"
