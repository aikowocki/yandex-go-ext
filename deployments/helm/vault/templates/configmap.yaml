apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  labels:
    app.kubernetes.io/name: vault
data:
  config.hcl: |
    ui = true
    disable_mlock = true
    api_addr = "http://vault.vault.svc.cluster.local:8200"
    cluster_addr = "http://127.0.0.1:8201"

    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address  = "0.0.0.0:8201"
      tls_disable     = true
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }
