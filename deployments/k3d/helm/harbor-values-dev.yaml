# Значения локального хранилища для кластера gophprofile k3d.
# Пароль администратора передается через install-harbor.sh и здесь не хранится.
expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    ports:
      http:
        port: 80
        nodePort: 30002
      https:
        port: 443
        nodePort: 30003

externalURL: http://localhost:30002

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 10Gi

# Keep the local cluster lightweight; enable scanning in the acceptance/prod-like setup.
trivy:
  enabled: false
