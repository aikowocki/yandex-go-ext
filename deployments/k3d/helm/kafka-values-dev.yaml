fullnameOverride: kafka

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT

controller:
  replicaCount: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

broker:
  replicaCount: 0

externalAccess:
  enabled: false

provisioning:
  enabled: true
  waitForKafka: true
  numPartitions: 3
  replicationFactor: 1
  topics:
    - name: avatar.uploaded
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "604800000"
    - name: avatar.deleted
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "604800000"
    - name: avatar.uploaded.dlq
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "2592000000"
    - name: avatar.deleted.dlq
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "2592000000"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi
