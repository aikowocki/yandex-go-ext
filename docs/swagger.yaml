basePath: /
definitions:
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.AvatarResponse:
    properties:
      created_at:
        type: string
      crop:
        $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.CropResponse'
      dimensions:
        $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.DimensionsResponse'
      file_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      mime_type:
        type: string
      size:
        type: integer
      status:
        type: string
      thumbnails:
        items:
          $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ThumbnailResponse'
        type: array
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.CropResponse:
    properties:
      size:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.DimensionsResponse:
    properties:
      height:
        type: integer
      width:
        type: integer
    type: object
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse:
    properties:
      details:
        type: string
      error:
        type: string
      max_size:
        type: integer
    type: object
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ListAvatarsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.AvatarResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ThumbnailResponse:
    properties:
      size:
        type: string
      url:
        type: string
    type: object
  github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.UploadResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      status:
        type: string
      url:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@gophprofile.local
    name: Поддержка API
  description: Сервис управления аватарами с асинхронной обработкой, S3 хранилищем
    и развёртыванием в Kubernetes
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: GophProfile API
  version: 1.0.0
paths:
  /api/v1/avatars:
    post:
      consumes:
      - multipart/form-data
      description: Загрузка файла изображения для создания нового аватара. Требует
        multipart/form-data с файлом и опциональными параметрами обрезки.
      parameters:
      - description: Идентификатор пользователя (обязателен)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Файл изображения (JPEG, PNG, WebP)
        in: formData
        name: file
        required: true
        type: file
      - description: Координата X обрезки (0.0-1.0)
        in: formData
        name: crop_x
        type: number
      - description: Координата Y обрезки (0.0-1.0)
        in: formData
        name: crop_y
        type: number
      - description: Размер обрезки (0.0-1.0)
        in: formData
        name: crop_size
        type: number
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.UploadResponse'
        "400":
          description: Некорректный ввод или неподдерживаемый формат файла
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "409":
          description: Аватар уже существует
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "413":
          description: Файл слишком большой (превышает 10МБ)
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Создание нового аватара
      tags:
      - Аватары
  /api/v1/avatars/{id}:
    delete:
      description: Удаляет конкретный аватар. Только владелец может удалять свой аватар.
      parameters:
      - description: Идентификатор пользователя (должен совпадать с владельцем)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: UUID аватара
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Аватар успешно удалён
        "400":
          description: Некорректный формат UUID
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "403":
          description: Пользователь не является владельцем аватара
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "404":
          description: Аватар не найден
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Удаление аватара
      tags:
      - Аватары
    get:
      description: Скачивает аватар в оригинальном или уменьшенном размере. Возвращает
        бинарный поток с соответствующим Content-Type.
      parameters:
      - description: UUID аватара
        in: path
        name: id
        required: true
        type: string
      - description: 'Размер изображения: original, 100x100, или 300x300 (по умолчанию:
          original)'
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: Бинарные данные изображения аватара
          schema:
            type: file
        "400":
          description: Некорректный UUID или параметр размера
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "404":
          description: Аватар или миниатюра не найдены
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Скачивание изображения аватара
      tags:
      - Аватары
  /api/v1/avatars/{id}/crop:
    patch:
      consumes:
      - application/json
      description: Обновляет координаты обрезки существующего аватара. Только владелец
        может обновлять свой аватар.
      parameters:
      - description: Идентификатор пользователя (должен совпадать с владельцем)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: UUID аватара
        in: path
        name: id
        required: true
        type: string
      - description: Параметры обрезки
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.AvatarResponse'
        "400":
          description: Некорректный ввод или отсутствующие параметры
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "403":
          description: Пользователь не является владельцем аватара
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "404":
          description: Аватар не найден
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Обновление параметров обрезки аватара
      tags:
      - Аватары
  /api/v1/avatars/{id}/metadata:
    get:
      description: Получает метаданные конкретного аватара, включая миниатюры с временными
        ссылками (действительны 15 минут).
      parameters:
      - description: UUID аватара
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.AvatarResponse'
        "400":
          description: Некорректный формат UUID
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "404":
          description: Аватар не найден
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Получение метаданных аватара
      tags:
      - Аватары
  /api/v1/users/{user_id}/avatar:
    delete:
      description: Удаляет активный аватар пользователя. ID пользователя в пути должен
        совпадать с заголовком X-User-ID.
      parameters:
      - description: Идентификатор пользователя (должен совпадать с path user_id)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Идентификатор пользователя
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: Аватар пользователя успешно удалён
        "400":
          description: Некорректный ввод
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "403":
          description: Несовпадение ID пользователя или пользователь не владелец
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "404":
          description: У пользователя нет активного аватара
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Удаление текущего аватара пользователя
      tags:
      - Аватары
    get:
      description: Скачивает активный аватар конкретного пользователя. Возвращает
        бинарный поток изображения.
      parameters:
      - description: Идентификатор пользователя
        in: path
        name: user_id
        required: true
        type: string
      - description: 'Размер изображения: original, 100x100, или 300x300 (по умолчанию:
          original)'
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: Бинарные данные аватара пользователя
          schema:
            type: file
        "400":
          description: Некорректный ввод
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
        "404":
          description: У пользователя нет активного аватара
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Скачивание текущего аватара пользователя
      tags:
      - Аватары
  /api/v1/users/{user_id}/avatars:
    get:
      description: Получает постраничный список всех аватаров конкретного пользователя.
      parameters:
      - description: Идентификатор пользователя
        in: path
        name: user_id
        required: true
        type: string
      - description: 'Элементов на странице (1-100, по умолчанию: 20)'
        in: query
        name: limit
        type: integer
      - description: 'Смещение для постраничности (по умолчанию: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список аватаров с информацией о постраничности
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ListAvatarsResponse'
        "400":
          description: Некорректный ввод
          schema:
            $ref: '#/definitions/github_com_aikowocki_yandex-go-ext_internal_transport_rest_dto.ErrorResponse'
      summary: Получение списка аватаров пользователя
      tags:
      - Аватары
  /health:
    get:
      description: Проверяет, готова ли служба обрабатывать трафик. Включает проверку
        внешних зависимостей (БД, хранилище, брокер).
      produces:
      - application/json
      responses:
        "200":
          description: Служба готова
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Служба не готова (зависимость нездорова)
          schema:
            additionalProperties: true
            type: object
      summary: Проверка готовности (readiness probe)
      tags:
      - Healthcheck
  /livez:
    get:
      description: Проверяет, что HTTP процесс сервера живой. Не проверяет внешние
        зависимости.
      produces:
      - application/json
      responses:
        "200":
          description: Сервер живой
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка живого процесса (liveness probe)
      tags:
      - Healthcheck
  /readyz:
    get:
      description: Проверяет, готова ли служба обрабатывать трафик. Включает проверку
        внешних зависимостей (БД, хранилище, брокер).
      produces:
      - application/json
      responses:
        "200":
          description: Служба готова
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Служба не готова (зависимость нездорова)
          schema:
            additionalProperties: true
            type: object
      summary: Проверка готовности (readiness probe)
      tags:
      - Healthcheck
schemes:
- http
- https
securityDefinitions:
  X-User-ID:
    description: Заголовок идентификатора пользователя (обязателен для операций записи)
    in: header
    name: X-User-ID
    type: apiKey
swagger: "2.0"
