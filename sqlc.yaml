version: "2"
sql:
  - schema: "internal/infra/postgres/migrations"
    queries: "internal/infra/postgres/queries"
    engine: "postgresql"
    gen:
      go:
        package: "gen"
        out: "internal/infra/postgres/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
